services:
  - type: web
    name: photobooth
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MAX_PHOTO_SIZE
        value: 5242880
      - key: PHOTO_CLEANUP_INTERVAL
        value: 3600000
    healthCheckPath: /health
    autoDeploy: true
